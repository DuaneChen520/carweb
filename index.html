<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="description" content="车机虚拟屏 - 为手机拓展的浏览器大屏，通过有线或无线方式连接手机" />
    <meta name="theme-color" content="#0f172a" />
    <meta property="og:title" content="CARWEB · 车机虚拟屏" />
    <meta property="og:description" content="为手机拓展的浏览器大屏，通过有线或无线方式连接手机" />
    <meta property="og:type" content="website" />
    <!-- 字体：Latin/数字用 Outfit，CJK 由系统字体承接；离线时优雅降级 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <title>车机虚拟屏</title>
    <script type="module">
      if (import.meta.hot?.on) {
        import.meta.hot.on('vite:error', (error) => {
          if (error.err) {
            console.error(
              [error.err.message, error.err.frame].filter(Boolean).join('\n'),
            )
          }
        })
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
